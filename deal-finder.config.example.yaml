# Deal Finder configuration. The agent creates deal-finder.config.yaml
# from this file during intake (see INTAKE.md) and reads it on every run.

intake:
  completed: false
  deferred_sections: []  # skipped for now; deferred means unknown, not "no"

basics:
  country: US
  currency: USD
  postal_code: ""        # optional, for shipping and tax estimates

discount_programs:
  military_veteran: false
  first_responder: false
  teacher: false
  student: false
  healthcare: false
  government: false
  employer_program: false
  warehouse_clubs: []    # e.g. [costco, sams_club, bjs]
  verifiers: []          # e.g. [id_me, unidays, verifypass]

marketplaces:
  ebay: true
  facebook_marketplace: false
  craigslist: false
  mercari: false
  poshmark: false

condition:
  default: new           # new | used_ok
  used_ok_categories: [] # e.g. [tools, auto_parts, dive_gear]
  always_new: [clothing, footwear]  # wins over used_ok_categories
  open_box_ok: false

retailers:
  preferred: []
  excluded: []

promo_tactics:
  newsletter_codes: ask  # ask | throwaway | own_email | never
  cashback_portals: false

rewards:
  points_programs: []    # e.g. [amex_mr, chase_ur]
  compare_gift_card_conversion: true

buying_rules:
  require_confirmation: true   # never change to false
  prepare_cart_for_review: true
  pursue_price_match: true
  remove_shipping_protection: true

watches:
  default_target: { type: percent_off, value: 25 }
  cadence: daily
  notify_via: chat

# Filled in by the agent during the capability self-check (INTAKE.md, s.9).
capabilities:
  retailer_browsing: unknown
  cart_and_code_testing: unknown
  scheduling: unknown    # scheduler name/task id, or "manual"
  amazon_route: unknown  # direct | user_device_browser | price_tracker | manual
  marketplace_access: {}
  throwaway_inbox: unknown
  notifications: unknown
